name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Smoke run replay extraction
        run: python -m python.replay.extract_timeline --replay examples/sample_replay.json --out reports/replay_states.jsonl

      - name: Smoke run offline evaluation
        run: python -m python.policy.run_offline_eval --samples reports/replay_states.jsonl --out reports/offline_eval_from_replay.json

      - name: Smoke run local loop
        run: python -m python.runtime.run_local_loop --samples examples/sample_states.json --out reports/local_loop_report.json

      - name: Smoke run scenario regression
        run: python -m python.runtime.run_scenarios --scenario-dir scenarios/local_ai --out reports/scenario_report.json

      - name: Smoke create scenario baseline
        run: python -m python.runtime.create_scenario_baseline --scenario-dir scenarios/local_ai --out reports/scenario_report_baseline.json

      - name: Gate scenario drift against committed baseline
        run: python -m python.runtime.run_scenarios --scenario-dir scenarios/local_ai --baseline scenarios/local_ai/baseline_report.json --require-baseline-match --max-drift 0.0 --fail-on-drift --out reports/scenario_report_gated.json

      - name: Build .NET runtime parity skeleton
        run: dotnet build dotnet/runtime/ColdChair.Runtime.csproj -c Release

      - name: Validate .NET game-state contract
        run: dotnet run --project dotnet/runtime/ColdChair.Runtime.csproj -- validate-game-state --file examples/sample_game_state.json

      - name: Validate .NET action-intent contract
        run: dotnet run --project dotnet/runtime/ColdChair.Runtime.csproj -- validate-action-intent --file examples/sample_action_intent.json

      - name: Smoke run end-to-end pipeline
        run: python -m python.runtime.run_e2e_pipeline --samples examples/sample_states.json --out reports/e2e_report.json --telemetry reports/e2e_telemetry.json

      - name: Smoke export Battle.net readiness
        run: python -m python.bn_readiness.manage_readiness export --out reports/bn_readiness.json

      - name: Smoke init training policy
        run: python -m python.training.orchestrate init-policy --version v1.0_ci --description "CI baseline policy"

      - name: Smoke register training dataset
        run: python -m python.training.orchestrate register-dataset --dataset-id ds_ci --name "CI Dataset" --samples examples/sample_states.json --tags "ci,test"

      - name: Smoke run training
        run: python -m python.training.orchestrate train --policy-version v1.0_ci --dataset-id ds_ci --out reports/training_result.json

      - name: Generate system dashboard
        run: python -m python.runtime.generate_dashboard --out reports/system_dashboard.json

      - name: Smoke run experiment with configuration
        run: python -c "from python.config.pipeline_config import create_default_config; import json; from pathlib import Path; config = create_default_config(); Path('examples/default_config.json').write_text(json.dumps(config.to_dict()))"; python -m python.config.run_experiment --config examples/default_config.json --samples examples/sample_states.json --out reports/experiment_result.json

      - name: Generate health report
        run: python -m python.runtime.generate_health_report --reports-dir reports --out reports/health_report.json
